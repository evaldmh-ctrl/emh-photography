<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evald Munksgaard Hansen — Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sand: #f5f2ed; --ink: #1a1814; --mist: #8c8880;
    --warm-white: #faf8f5; --border: rgba(26,24,20,0.12);

  }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font-mono); background: var(--warm-white); color: var(--ink); font-size: 13px; letter-spacing: 0.02em; min-height: 100vh; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; background: rgba(250,248,245,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .nav-logo { font-family: var(--font-serif); font-size: 18px; font-weight: 300; letter-spacing: 0.08em; color: var(--ink); cursor: pointer; }
  .nav-links { display: flex; gap: 56px; list-style: none; align-items: center; }
  .nav-links a { text-decoration: none; color: var(--mist); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; transition: color 0.2s; cursor: pointer; }
  .nav-links a:hover, .nav-links a.active { color: var(--ink); }
  .nav-right { display: flex; align-items: center; gap: 28px; }
  .nav-cart { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; color: var(--mist); transition: color 0.2s; display: flex; align-items: center; gap: 6px; }
  .nav-cart:hover { color: var(--ink); }
  .cart-count { background: var(--ink); color: var(--warm-white); border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .lang-toggle { display: flex; align-items: center; border: 1px solid var(--border); overflow: hidden; }
  .lang-btn { padding: 5px 10px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; background: transparent; color: var(--mist); border: none; cursor: pointer; transition: all 0.18s; line-height: 1; }
  .lang-btn.active { background: var(--ink); color: var(--warm-white); }
  .lang-btn:not(.active):hover { color: var(--ink); }
  .lang-divider { width: 1px; height: 14px; background: var(--border); }
  .page { display: none; padding-top: 61px; min-height: 100vh; }
  .page.active { display: block; }
  .hero { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 61px); }
  .hero-image { position: relative; overflow: hidden; }
  .hero-image img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.92); }
  .hero-content { display: flex; flex-direction: column; justify-content: flex-end; padding: 80px 64px; background: var(--sand); }
  .hero-eyebrow { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mist); margin-bottom: 24px; }
  .hero-title { font-family: var(--font-serif); font-size: clamp(40px, 4vw, 68px); font-weight: 300; line-height: 1.05; letter-spacing: -0.01em; margin-bottom: 32px; color: var(--ink); }
  .hero-title em { font-style: italic; color: var(--mist); }
  .hero-desc { font-size: 12px; line-height: 1.8; color: var(--mist); max-width: 360px; margin-bottom: 48px; }
  .btn-primary { display: inline-block; padding: 14px 32px; background: var(--ink); color: var(--warm-white); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; border: none; transition: opacity 0.2s; font-family: var(--font-mono); }
  .btn-primary:hover { opacity: 0.82; }
  .btn-secondary { display: inline-block; padding: 13px 32px; background: transparent; color: var(--ink); border: 1px solid var(--border); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; font-family: var(--font-mono); }
  .btn-secondary:hover { background: var(--ink); color: var(--warm-white); }
  .gallery-section { padding: 80px 40px; }
  .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 48px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .section-title { font-family: var(--font-serif); font-size: 36px; font-weight: 300; letter-spacing: -0.01em; }
  .section-count { font-size: 11px; color: var(--mist); letter-spacing: 0.1em; }
  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .gallery-item { position: relative; aspect-ratio: 4/5; overflow: hidden; cursor: pointer; background: var(--sand); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.45s ease; filter: brightness(0.95); position: absolute; top: 0; left: 0; }
  .gallery-item img.mock-img { opacity: 0; }
  .gallery-item:hover img.main-img { opacity: 0; transform: scale(1.04); }
  .gallery-item:hover img.mock-img { opacity: 1; }
  .gallery-item-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(26,24,20,0.7) 0%, transparent 50%); opacity: 0; transition: opacity 0.4s; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; z-index: 2; }
  .gallery-item:hover .gallery-item-overlay { opacity: 1; }
  .gallery-item-title { font-family: var(--font-serif); font-size: 20px; font-weight: 300; color: white; margin-bottom: 4px; }
  .gallery-item-price { font-size: 11px; color: rgba(255,255,255,0.7); letter-spacing: 0.08em; }
  .product-layout { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 61px); }
  .product-image-area { position: relative; background: var(--sand); display: flex; align-items: center; justify-content: center; padding: 40px; min-height: 600px; overflow: hidden; cursor: crosshair; }
  .product-image-area img { max-width: 100%; max-height: 70vh; object-fit: contain; filter: brightness(0.95); position: absolute; transition: opacity 0.45s ease; }
  .product-image-area img.p-main { opacity: 1; }
  .product-image-area img.p-mock { opacity: 0; }
  .product-image-area:hover img.p-main { opacity: 0; }
  .product-image-area:hover img.p-mock { opacity: 1; }
  .img-hint { position: absolute; bottom: 18px; right: 18px; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist); transition: opacity 0.3s; pointer-events: none; z-index: 3; }
  .product-image-area:hover .img-hint { opacity: 0; }
  .product-info { padding: 64px 56px; display: flex; flex-direction: column; justify-content: center; border-left: 1px solid var(--border); overflow-y: auto; }
  .product-number { font-size: 10px; color: var(--mist); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 20px; }
  .product-title { font-family: var(--font-serif); font-size: 42px; font-weight: 300; line-height: 1.1; margin-bottom: 16px; color: var(--ink); }
  .product-price-display { font-family: var(--font-serif); font-size: 26px; font-weight: 300; color: var(--ink); margin-bottom: 40px; }
  .option-group { margin-bottom: 28px; }
  .option-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mist); margin-bottom: 12px; }
  .option-value-display { font-size: 12px; color: var(--ink); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .option-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { padding: 8px 16px; border: 1px solid var(--border); font-size: 11px; letter-spacing: 0.06em; cursor: pointer; transition: all 0.15s; color: var(--mist); background: transparent; font-family: var(--font-mono); }
  .pill:hover { border-color: var(--ink); color: var(--ink); }
  .pill.selected { background: var(--ink); color: var(--warm-white); border-color: var(--ink); }
  .divider { height: 1px; background: var(--border); margin: 32px 0; }
  .product-meta { font-size: 11px; color: var(--mist); line-height: 1.8; margin-bottom: 32px; }
  .add-to-cart-btn { width: 100%; padding: 16px; background: var(--ink); color: var(--warm-white); border: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; transition: opacity 0.2s; margin-bottom: 12px; }
  .add-to-cart-btn:hover { opacity: 0.82; }
  .wishlist-btn { width: 100%; padding: 14px; background: transparent; color: var(--mist); border: 1px solid var(--border); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; transition: all 0.15s; }
  .wishlist-btn:hover { color: var(--ink); border-color: var(--ink); }
  .cart-overlay { position: fixed; inset: 0; background: rgba(26,24,20,0.4); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .cart-overlay.open { opacity: 1; pointer-events: all; }
  .cart-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; background: var(--warm-white); z-index: 201; transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94); display: flex; flex-direction: column; border-left: 1px solid var(--border); }
  .cart-panel.open { transform: translateX(0); }
  .cart-header { display: flex; align-items: center; justify-content: space-between; padding: 28px 32px; border-bottom: 1px solid var(--border); }
  .cart-header-title { font-family: var(--font-serif); font-size: 22px; font-weight: 300; }
  .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--mist); line-height: 1; font-family: var(--font-mono); transition: color 0.2s; }
  .close-btn:hover { color: var(--ink); }
  .cart-items { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .cart-item { display: grid; grid-template-columns: 80px 1fr auto; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--border); align-items: start; }
  .cart-item-img { width: 80px; height: 100px; object-fit: cover; background: var(--sand); }
  .cart-item-name { font-family: var(--font-serif); font-size: 16px; font-weight: 300; margin-bottom: 6px; }
  .cart-item-details { font-size: 11px; color: var(--mist); line-height: 1.6; }
  .cart-item-price { font-size: 13px; font-family: var(--font-serif); }
  .remove-item { background: none; border: none; color: var(--mist); cursor: pointer; font-size: 16px; padding: 0; margin-top: 4px; font-family: var(--font-mono); }
  .remove-item:hover { color: var(--ink); }
  .cart-footer { padding: 24px 32px; border-top: 1px solid var(--border); }
  .cart-total { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  .cart-total-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mist); }
  .cart-total-amount { font-family: var(--font-serif); font-size: 24px; font-weight: 300; }
  .cart-empty { text-align: center; padding: 60px 20px; color: var(--mist); }
  .cart-empty-title { font-family: var(--font-serif); font-size: 24px; font-weight: 300; margin-bottom: 12px; }
  .cart-empty-text { font-size: 12px; line-height: 1.7; }
  .back-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mist); cursor: pointer; padding: 18px 40px; border-bottom: 1px solid var(--border); transition: color 0.2s; background: none; border-top: none; border-left: none; border-right: none; width: 100%; text-align: left; font-family: var(--font-mono); }
  .back-btn:hover { color: var(--ink); }
  .about-layout { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 61px); }
  .about-image { background: var(--sand); overflow: hidden; box-shadow: inset 0 0 60px rgba(26,24,20,0.45), inset 0 0 120px rgba(26,24,20,0.25); }
  .about-image img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.92); }
  .about-content { padding: 80px 64px; display: flex; flex-direction: column; justify-content: center; }
  .about-eyebrow { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mist); margin-bottom: 24px; }
  .about-title { font-family: var(--font-serif); font-size: 48px; font-weight: 300; line-height: 1.1; margin-bottom: 32px; }
  .about-text { font-size: 12px; line-height: 1.9; color: var(--mist); max-width: 440px; margin-bottom: 20px; }
  .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--ink); color: var(--warm-white); padding: 14px 28px; font-size: 11px; letter-spacing: 0.1em; z-index: 300; transition: transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94); white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .topbar { background: var(--ink); color: var(--warm-white); text-align: center; padding: 10px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; }
  @media (max-width: 768px) {
    nav { padding: 16px 20px; } .nav-links { display: none; }
    .hero, .product-layout, .about-layout { grid-template-columns: 1fr; }
    .hero-image { height: 50vh; } .hero-content { padding: 40px 24px; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .product-info { padding: 32px 24px; } .gallery-section { padding: 40px 20px; }
    .cart-panel { width: 100%; } .about-content { padding: 40px 24px; }
  }
</style>
</head>
<body>

<div class="topbar" id="topbar-text"></div>
<nav>
  <span class="nav-logo" onclick="showPage('home')">EMH</span>

    <div class="nav-cart" onclick="toggleCart()">

</nav>

<div class="page active" id="page-home">
  <div class="hero">

  <div class="gallery-section" id="gallery-anchor">

    <div class="gallery-grid" id="gallery-grid"></div>
  </div>
</div>

<div class="page" id="page-product">

  <div class="product-layout">

        <div class="option-label" id="label-size"></div>

          <button class="pill selected" onclick="selectOption('size','30x40',this)">30×40</button>
          <button class="pill" onclick="selectOption('size','55.5x70',this)">55,5×70</button>
          <button class="pill" onclick="selectOption('size','95.2x120',this)">95,2×120</button>

      </div>
      <div class="option-group">
        <div class="option-label" id="label-frame"></div>

          <button class="pill" onclick="selectOption('frame','black',this)" id="pill-black"></button>

      <div class="divider"></div>
      <p class="product-meta" id="product-meta"></p>
      <button class="add-to-cart-btn" id="atc-btn" onclick="addToCart()"></button>
      <button class="wishlist-btn" id="wishlist-btn"></button>
    </div>
  </div>
</div>

<div class="page" id="page-about">
  <div class="about-layout">
    <div class="about-image">
      <img src="images/image_02.jpg" alt="Evald" />
    </div>
    <div class="about-content">
      <p class="about-eyebrow" id="about-eyebrow"></p>
      <h1 class="about-title">Evald<br>Munksgaard<br>Hansen</h1>
      <p class="about-text" id="about-text1"></p>
      <p class="about-text" id="about-text2"></p>
      <button class="btn-secondary" id="about-cta" onclick="showPage('home')"></button>
      <a href="https://numeromagazine.ch/souls-of-zanzibar-a-heartfelt-journey-in-meaningful-aesthetics/" target="_blank" rel="noopener" class="btn-secondary" id="about-numero" style="display:inline-block; margin-top:12px; text-decoration:none;"" id="about-numero-link">Læs om Souls of Zanzibar i Numéro ↗</a>
    </div>
  </div>
</div>

<div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cart-panel">
  <div class="cart-header">
    <span class="cart-header-title" id="cart-title"></span>
    <button class="close-btn" onclick="toggleCart()">×</button>
  </div>
  <div class="cart-items" id="cart-items-list"></div>
  <div class="cart-footer" id="cart-footer" style="display:none">
    <div class="cart-total">
      <span class="cart-total-label" id="cart-total-label"></span>
      <span class="cart-total-amount" id="cart-total">kr. 0</span>
    </div>
    <button class="add-to-cart-btn" id="checkout-btn" onclick="goToCheckout()"></button>
    <button class="wishlist-btn" id="continue-btn" onclick="toggleCart()"></button>
  </div>
</div>
<div class="toast" id="toast"></div>

const prices = {
  "30x40":    { art_paper:2500 },
  "55.5x70":  { art_paper:5000 },
  "95.2x120": { art_paper:7500 }
};
const pricesEUR = {
  "30x40":    { art_paper:335 },
  "55.5x70":  { art_paper:670 },
  "95.2x120": { art_paper:1000 }
};
const productSizes = {
  6: [
    { value: "40x40",   label: "40×40" },
    { value: "70x70",   label: "70×70" },
    { value: "100x100", label: "100×100" }
  ]
};
const productPrices = {
  5: { "30x40": 4500, "55.5x70": 7500, "95.2x120": 12000 },
  6: { "40x40": 2500, "70x70": 5000, "100x100": 7500 }
};
const productPricesEUR = {
  5: { "30x40": 600, "55.5x70": 1000, "95.2x120": 1600 },
  6: { "40x40": 335, "70x70": 670, "100x100": 1000 }
};
const frameAddon = { oak:0, white:0, black:0 };

let lang = 'da', T = TRANSLATIONS.da;
let cart = [], currentProduct = null;
let selections = { material:'art_paper', size:'30x40', frame:'oak' };

function setLang(l) {
  lang = l; T = TRANSLATIONS[l];
  document.getElementById('btn-da').classList.toggle('active', l==='da');
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  applyTranslations(); buildGallery(); updateCartUI();
  if (currentProduct) updateProductPage();
}

function applyTranslations() {
  document.getElementById('topbar-text').textContent = T.topbar;
  document.getElementById('nav-home').textContent = T.navGallery;
  document.getElementById('nav-about').textContent = T.navAbout;
  document.getElementById('nav-contact').textContent = T.navContact;
  document.getElementById('nav-cart-label').textContent = T.navCart;
  document.getElementById('hero-title').innerHTML = T.heroTitle;
  document.getElementById('hero-desc').textContent = T.heroDesc;
  document.getElementById('hero-cta').textContent = T.heroCta;
  document.getElementById('section-title').textContent = T.sectionTitle;
  document.getElementById('section-count').textContent = T.sectionCount;
  document.getElementById('back-btn').textContent = T.backBtn;
  document.getElementById('img-hint').textContent = T.imgHint;
  document.getElementById('label-size').innerHTML = T.labelSize + ' — <span class="option-value-display" id="selected-size">' + getSizeLabel(selections.size) + '</span>';
  document.getElementById('label-frame').innerHTML = T.labelFrame + ' — <span class="option-value-display" id="selected-frame">' + getFrameLabel(selections.frame) + '</span>';
  document.getElementById('pill-oak').textContent = T.frameOak;
  document.getElementById('pill-white').textContent = T.frameWhite;
  document.getElementById('pill-black').textContent = T.frameBlack;
  document.getElementById('product-meta').innerHTML = T.productMeta.replace(/\n/g,'<br>');
  document.getElementById('wishlist-btn').textContent = T.wishlistBtn;
  document.getElementById('cart-title').textContent = T.cartTitle;
  document.getElementById('about-eyebrow').textContent = T.aboutEyebrow;
  document.getElementById('about-text1').textContent = T.aboutText1;
  document.getElementById('about-text2').textContent = T.aboutText2;
  document.getElementById('about-cta').textContent = T.aboutCta;
  document.getElementById('about-numero').textContent = T.aboutNumero;
  updatePrice();
}

function getSizeLabel(s) { return s.replace('x','×') + ' cm'; }
function getFrameLabel(f) { return {oak:T.frameOak,white:T.frameWhite,black:T.frameBlack}[f]||f; }
function getMaterialLabel(m) { return m==='art_paper' ? T.matPaper : T.matGlass; }

function buildGallery() {
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = T.products.map((p,i) => `
    <div class="gallery-item" onclick="openProduct(${i})">
      <img class="main-img" src="${IMGS[i]}" alt="${p.title}" />
      <img class="mock-img" src="${MOCK_IMGS[i]}" alt="${p.title} on wall" />
      <div class="gallery-item-overlay">
        <div class="gallery-item-title">${p.title}</div>
        <div class="gallery-item-price">${T.productFromPrice ? T.productFromPrice[i] : T.fromPrice}</div>
      </div>
    </div>
  `).join('');
}

function openProduct(idx) {
  currentProduct = { imgIdx: idx };
  const defaultSize = (productSizes[idx] && productSizes[idx][0]) ? productSizes[idx][0].value : '30x40';
  selections = { material:'art_paper', size:defaultSize, frame:'oak' };
  updateProductPage(); resetPills(); showPage('product'); window.scrollTo(0,0);
}

function updateProductPage() {
  if (!currentProduct) return;
  const idx = currentProduct.imgIdx;
  // Byg størrelses-pills dynamisk baseret på produkt
  const sizeContainer = document.querySelector('.option-pills');
  const sizes = productSizes[idx] || [
    { value: '30x40',    label: '30×40' },
    { value: '55.5x70',  label: '55,5×70' },
    { value: '95.2x120', label: '95,2×120' }
  ];
  sizeContainer.innerHTML = sizes.map((s, i) =>
    `<button class="pill${i===0?' selected':''}" onclick="selectOption('size','${s.value}',this)">${s.label}</button>`
  ).join('\n          ');
  document.getElementById('product-img-main').src = IMGS[idx];
  document.getElementById('product-img-mock').src = MOCK_IMGS[idx];
  document.getElementById('product-title').textContent = T.products[idx].title;
  document.getElementById('product-number').textContent = T.products[idx].number;
  const desc = T.products[idx].description;
  const descEl = document.getElementById('product-description');
  if (desc) { descEl.innerHTML = desc.replace(/\n/g,'<br>'); descEl.style.display = 'block'; }
  else { descEl.style.display = 'none'; }
  applyTranslations();
}

function resetPills() {
  document.querySelectorAll('.option-pills').forEach(group => {
    group.querySelectorAll('.pill').forEach((p,i) => p.classList.toggle('selected', i===0));
  });
}

function selectOption(type, value, el) {
  el.parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
  el.classList.add('selected');
  selections[type] = value;
  const map = { material:'selected-material', size:'selected-size', frame:'selected-frame' };
  const el2 = document.getElementById(map[type]);
  if (el2) {
    if (type==='material') el2.textContent = getMaterialLabel(value);
    else if (type==='size') el2.textContent = getSizeLabel(value);
    else el2.textContent = getFrameLabel(value);
  }
  updatePrice();
}

function calculatePrice() {
  const idx = currentProduct ? currentProduct.imgIdx : null;
  const isEN = lang === "en";
  const priceTable = isEN ? pricesEUR : prices;
  const ppTable = isEN ? productPricesEUR : productPrices;
  const pp = (idx !== null && ppTable[idx]) ? ppTable[idx][selections.size] : null;
  const base = pp !== null && pp !== undefined ? pp : (priceTable[selections.size][selections.material]||(isEN?335:2500));
  return base + (frameAddon[selections.frame]||0);
}

function updatePrice() {
  const p = calculatePrice();
  const f = lang === 'en' ? '€\u00a0' + p.toLocaleString('de-DE') : 'DKK ' + p.toLocaleString('da-DK');
  document.getElementById('product-price-display').textContent = f;
  document.getElementById('atc-btn').textContent = T.atcBtn + ' — ' + f;
}

function addToCart() {
  if (!currentProduct) return;
  const idx = currentProduct.imgIdx;
  cart.push({ id:Date.now(), imgIdx:idx, material:selections.material, size:selections.size, frame:selections.frame, price:calculatePrice() });
  updateCartUI();
  showToast('"' + T.products[idx].title + '" ' + T.addedToCart);
  toggleCart();
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  updateCartUI();
}

function updateCartUI() {
  const count = cart.length;
  document.getElementById('cart-count').textContent = count;
  const list = document.getElementById('cart-items-list');
  const footer = document.getElementById('cart-footer');
  if (count === 0) {
    list.innerHTML = `<div class="cart-empty"><p class="cart-empty-title">${T.cartEmptyTitle}</p><p class="cart-empty-text">${T.cartEmptyText.replace('\n','<br>')}</p></div>`;
    footer.style.display = 'none'; return;
  }
  footer.style.display = 'block';
  document.getElementById('checkout-btn').textContent = T.checkoutBtn;
  document.getElementById('continue-btn').textContent = T.continueBtn;
  document.getElementById('cart-total-label').textContent = T.cartTotalLabel;
  list.innerHTML = cart.map(item => `
    <div class="cart-item">
      <img class="cart-item-img" src="${IMGS[item.imgIdx]}" alt="" />
      <div>
        <div class="cart-item-name">${T.products[item.imgIdx].title}</div>
        <div class="cart-item-details">${getMaterialLabel(item.material)}<br>${getSizeLabel(item.size)}<br>${T.frameLabel}: ${getFrameLabel(item.frame)}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
        <span class="cart-item-price">${lang === 'en' ? '€\u00a0' + item.price.toLocaleString('de-DE') : 'DKK ' + item.price.toLocaleString('da-DK')}</span>
        <button class="remove-item" onclick="removeFromCart(${item.id})">×</button>
      </div>
    </div>
  `).join('');
  const total = cart.reduce((s,i) => s+i.price, 0);
  document.getElementById('cart-total').textContent = lang === 'en' ? '€\u00a0' + total.toLocaleString('de-DE') : 'DKK ' + total.toLocaleString('da-DK');
}

function toggleCart() {
  const overlay = document.getElementById('cart-overlay');
  const panel = document.getElementById('cart-panel');
  const open = panel.classList.contains('open');
  overlay.classList.toggle('open', !open);
  panel.classList.toggle('open', !open);
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
  const navEl = document.getElementById('nav-' + name);
  if (navEl) navEl.classList.add('active');
  window.scrollTo(0,0);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

applyTranslations(); buildGallery(); updateCartUI();

// ─── Stripe Checkout ─────────────────────────────────────────────────────────
async function goToCheckout() {
  if (cart.length === 0) return;

  const checkoutBtn = document.getElementById('checkout-btn');
  const originalText = checkoutBtn.textContent;
  checkoutBtn.textContent = lang === 'en' ? 'Loading...' : 'Vent venligst...';
  checkoutBtn.disabled = true;

  const items = cart.map(item => ({
    title:    T.products[item.imgIdx].title,
    size:     item.size,
    frame:    item.frame,
    material: item.material,
    price:    item.price,
    imgIdx:   item.imgIdx,
  }));

  try {
    const response = await fetch('/.netlify/functions/create-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items, lang }),
    });

    const data = await response.json();

    if (data.url) {
      window.location.href = data.url;
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch (err) {
    console.error('Checkout error:', err);
    const msg = lang === 'en'
      ? 'Something went wrong. Please try again.'
      : 'Noget gik galt. Prøv igen.';
    showToast(msg);
    checkoutBtn.textContent = originalText;
    checkoutBtn.disabled = false;
  }
}

// ─── Payment result banner (shown after Stripe redirect) ─────────────────────
(function() {
  const params = new URLSearchParams(window.location.search);
  const payment = params.get('payment');
  if (payment === 'success') {
    cart = [];
    updateCartUI();
    const msg = lang === 'da'
      ? '\u2713 Betaling gennemf\u00f8rt - tak for dit k\u00f8b!'
      : '\u2713 Payment successful - thank you for your purchase!';
    setTimeout(() => showToast(msg), 600);
    window.history.replaceState({}, '', '/');
  } else if (payment === 'cancelled') {
    const msg = lang === 'da' ? 'Betaling annulleret.' : 'Payment cancelled.';
    setTimeout(() => showToast(msg), 600);
    window.history.replaceState({}, '', '/');
  }
})();
</script>
